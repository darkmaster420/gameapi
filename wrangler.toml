name = "gameapi"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true

[vars]
# Environment variables for the worker

# REQUIRED: FlareSolverr instance URL for bypassing Cloudflare protection (SteamRip, Skidrow)
# You must set this for SteamRip and SkidrowReloaded to work
# Example: FLARESOLVERR_URL = "http://your-flaresolverr:8191/v1"
# To run FlareSolverr: docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
FLARESOLVERR_URL = ""  # Set this to your FlareSolverr instance

# OPTIONAL: Timeout for FlareSolverr requests in milliseconds (default: 30000 = 30s)
# FLARE_TIMEOUT_MS = "60000"

# OPTIONAL: Number of retry attempts for FlareSolverr requests (default: 2)
# FLARE_RETRIES = "3"

# For local development, you can also add:
# [env.dev.vars]
# FLARESOLVERR_URL = "http://localhost:8191/v1"
# FLARE_TIMEOUT_MS = "60000"
# FLARE_RETRIES = "3"