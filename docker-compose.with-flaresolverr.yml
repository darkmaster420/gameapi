version: '3.8'

services:
  # FlareSolverr service - internal only, not exposed
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: gameapi-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    networks:
      - gameapi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # GameAPI service
  gameapi:
    build: .
    container_name: gamesearch-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # FlareSolverr URL (internal Docker network)
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - FLARE_TIMEOUT_MS=60000
      - FLARE_RETRIES=3
    depends_on:
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - gameapi-network

networks:
  gameapi-network:
    driver: bridge
